<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework Helper</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
    --line: #30363d; --blue: #00caff; --deep: #1f6feb; --yellow: #ffcc33;
    --red: #ff5c5c; --user: #1f6feb; --ring-idle: #22303c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; padding: 28px 16px 8px; }
  h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
  .sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }

  /* The device: an Echo seen from above, with its light ring. */
  .device {
    position: relative; width: 220px; height: 220px; margin: 28px 0 12px;
    border: 0; border-radius: 50%; padding: 0; cursor: pointer;
    background: radial-gradient(circle at 50% 40%, #2a3038, #15191e 70%);
    box-shadow: 0 10px 40px #000a, inset 0 2px 6px #ffffff10;
  }
  .device:focus-visible { outline: 3px solid var(--blue); outline-offset: 6px; }
  .ring {
    position: absolute; inset: -10px; border-radius: 50%; pointer-events: none;
    background: conic-gradient(var(--ring-idle) 0 100%);
    -webkit-mask: radial-gradient(circle, transparent 113px, #000 114px);
            mask: radial-gradient(circle, transparent 113px, #000 114px);
    transition: filter .3s;
  }
  .grille {
    position: absolute; inset: 40px; border-radius: 50%; opacity: .35;
    background: radial-gradient(#ffffff30 1.2px, transparent 1.6px) 0 0 / 10px 10px;
  }
  .label {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: .8rem; letter-spacing: .08em;
    text-transform: uppercase;
  }

  .listening .ring {
    background: conic-gradient(from var(--spin, 0deg), var(--deep) 0 30%, var(--blue) 40% 60%, var(--deep) 70% 100%);
    filter: drop-shadow(0 0 14px var(--blue));
  }
  .thinking .ring {
    background: conic-gradient(from var(--spin, 0deg), var(--deep) 0 70%, var(--blue) 85%, #fff 90%, var(--deep) 100%);
    filter: drop-shadow(0 0 10px var(--blue)); animation: spin 1s linear infinite;
  }
  .speaking .ring {
    background: conic-gradient(var(--blue) 0 100%);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .notify .ring {
    background: conic-gradient(var(--yellow) 0 100%);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .error .ring { background: conic-gradient(var(--red) 0 100%); }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --spin: 360deg; } }
  @keyframes pulse {
    50% { filter: drop-shadow(0 0 18px currentColor) brightness(1.35); }
  }
  @media (prefers-reduced-motion: reduce) {
    .thinking .ring, .speaking .ring, .notify .ring { animation: none; }
  }

  .status { min-height: 1.5em; color: var(--muted); text-align: center; padding: 0 16px; }
  .heard { font-style: italic; color: var(--text); }

  main { width: 100%; max-width: 640px; padding: 0 16px 24px; flex: 1;
         display: flex; flex-direction: column; }
  .log { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; }
  .msg.you { align-self: flex-end; background: var(--user); color: #fff;
             border-bottom-right-radius: 4px; }
  .msg.alexa { align-self: flex-start; background: var(--panel);
               border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.alexa.bad { border-color: var(--red); }
  .msg.alexa.note { border-color: var(--yellow); }

  form { display: flex; gap: 8px; margin-top: auto; }
  input {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font: inherit;
  }
  input:focus { outline: 2px solid var(--deep); border-color: transparent; }
  button.pill {
    padding: 0 18px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit; cursor: pointer;
  }
  button.pill:hover { border-color: var(--muted); }
  .tips { color: var(--muted); font-size: .85rem; text-align: center; margin: 14px 0 0; }
  .tips kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
</style>
</head>
<body>
<header>
  <h1>Homework Helper</h1>
  <div class="sub">Simulated Alexa+ · Amazon Bedrock · Strands Agents · MCP</div>
</header>

<button class="device" id="device" aria-label="Tap to talk">
  <span class="ring"></span><span class="grille"></span>
  <span class="label" id="label">Tap to talk</span>
</button>
<div class="status" id="status" aria-live="polite"></div>

<main>
  <div class="log" id="log"></div>
  <form id="form">
    <input id="typed" placeholder="Or type: what should I work on?" autocomplete="off"
           aria-label="Type a question">
    <button class="pill" type="submit">Send</button>
    <button class="pill" type="button" id="reset" title="Start a new conversation">New</button>
  </form>
  <p class="tips">Tap the ring or press <kbd>Space</kbd>, then say “Alexa, what should I work on?”</p>
</main>

<script>
const device = document.getElementById("device");
const label = document.getElementById("label");
const statusEl = document.getElementById("status");
const log = document.getElementById("log");
let state = "idle";
let unread = 0;

function setState(next, text = "") {
  state = next;
  device.className = "device " + (next === "idle" && unread ? "notify" : next);
  label.textContent = {
    idle: unread ? `${unread} notification${unread > 1 ? "s" : ""}` : "Tap to talk",
    listening: "Listening", thinking: "", speaking: "", error: "",
  }[next];
  statusEl.textContent = text;
}

function addMessage(who, text, extra = "") {
  const div = document.createElement("div");
  div.className = `msg ${who} ${extra}`;
  div.textContent = text;
  log.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

// A short two-note chime, like the sound when Alexa starts listening.
function chime(notes = [660, 880]) {
  try {
    const ctx = new AudioContext();
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      const t = ctx.currentTime + i * 0.12;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.3);
    });
  } catch {}
}

// --- Speaking -------------------------------------------------------------
let voice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  const prefer = [/Aria.*Natural/i, /Jenny.*Natural/i, /Natural.*English \(United States\)/i,
                  /Google US English/i, /Samantha/i, /Zira/i];
  for (const re of prefer) {
    const v = voices.find(v => re.test(v.name));
    if (v) return (voice = v);
  }
  voice = voices.find(v => v.lang === "en-US") || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text) {
  return new Promise(resolve => {
    if (!("speechSynthesis" in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = 1.05;
    u.onend = u.onerror = resolve;
    setState("speaking");
    speechSynthesis.speak(u);
  }).then(() => setState("idle"));
}

// --- Asking ---------------------------------------------------------------
const WAKE = /^\s*(hey\s+)?alexa[\s,.!]*/i;

async function ask(text) {
  text = text.replace(WAKE, "").trim();
  if (!text) return setState("idle");
  addMessage("you", text);

  if (/notification|what did i miss/i.test(text)) return readNotifications();

  setState("thinking", "Thinking…");
  try {
    const res = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const { reply, error } = await res.json();
    addMessage("alexa", reply, error ? "bad" : "");
    if (error) { setState("error"); await new Promise(r => setTimeout(r, 600)); }
    await speak(reply);
  } catch {
    addMessage("alexa", "I can't reach the Homework Helper server.", "bad");
    setState("error", "Is the server running?");
  }
}

// --- Notifications (proactive reminders) ----------------------------------
async function checkNotifications() {
  try {
    const { count } = await (await fetch("/api/notifications")).json();
    if (count > unread) chime([880, 660]);
    unread = count;
    if (state === "idle") setState("idle");
  } catch {}
}

async function readNotifications() {
  const { notifications } = await (await fetch("/api/notifications", { method: "POST" })).json();
  unread = 0;
  const text = notifications.length
    ? `You have ${notifications.length} notification${notifications.length > 1 ? "s" : ""}. ` + notifications.join(" ")
    : "You have no new notifications.";
  addMessage("alexa", text, "note");
  await speak(text);
}

setTimeout(checkNotifications, 1500);
setInterval(checkNotifications, 60_000);

// --- Listening ------------------------------------------------------------
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;

function listen() {
  if (state === "speaking") { speechSynthesis.cancel(); }
  if (state === "listening") return recognizer?.stop();
  if (state === "thinking") return;
  if (!Recognition) {
    setState("idle", "Voice input needs Chrome or Edge. You can type instead.");
    return document.getElementById("typed").focus();
  }
  // Tapping with unread notifications reads them, like on an Echo.
  if (unread) return readNotifications();

  recognizer = new Recognition();
  recognizer.lang = "en-US";
  recognizer.interimResults = true;
  let finalText = "";
  recognizer.onresult = e => {
    const latest = [...e.results].map(r => r[0].transcript).join("");
    if (e.results[e.results.length - 1].isFinal) finalText = latest;
    statusEl.innerHTML = "";
    const span = document.createElement("span");
    span.className = "heard"; span.textContent = latest;
    statusEl.appendChild(span);
  };
  recognizer.onerror = e => {
    if (e.error === "not-allowed") setState("error", "Allow microphone access to talk.");
  };
  recognizer.onend = () => {
    if (finalText) ask(finalText);
    else if (state === "listening") setState("idle", "I didn't hear anything.");
  };
  chime();
  setState("listening");
  recognizer.start();
}

device.addEventListener("click", listen);
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !["INPUT", "BUTTON"].includes(document.activeElement.tagName)) {
    e.preventDefault(); listen();
  }
});
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("typed");
  const text = input.value; input.value = "";
  if (state !== "thinking") ask(text);
});
document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  log.innerHTML = "";
  setState("idle", "New conversation.");
});
setState("idle");
</script>
</body>
</html>
