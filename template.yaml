AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Homework Helper: the MCP server on AWS Lambda, reminder checks on Amazon
  EventBridge Scheduler, and state in Amazon DynamoDB.
  Deploy with: python deploy/deploy.py  (see README)

Parameters:
  CanvasUrl:
    Type: String
    Description: Your Canvas address, e.g. https://myschool.instructure.com
  CanvasToken:
    Type: String
    NoEcho: true
  McpApiKey:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: Bearer token every MCP request must send
  StudentTimezone:
    Type: String
    Default: America/Los_Angeles
  StudyStart:
    Type: String
    Default: "16:00"
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: Model that writes short spoken names for assignments
  GoogleTokenJson:
    Type: String
    NoEcho: true
    Default: ""
    Description: Contents of token.json, so the server can add study sessions (optional)

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    MemorySize: 512
    Environment:
      Variables:
        CANVAS_URL: !Ref CanvasUrl
        CANVAS_TOKEN: !Ref CanvasToken
        STUDENT_TIMEZONE: !Ref StudentTimezone
        STUDY_START: !Ref StudyStart
        HOMEWORK_TABLE: !Ref HomeworkTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  # Both functions keep data in the table and ask Bedrock for short spoken
  # assignment names. The model is a cross-region inference profile, so it
  # may run in any US region.
  AppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem,
                     dynamodb:Query, dynamodb:BatchWriteItem]
            Resource: !GetAtt HomeworkTable.Arn
          - Effect: Allow
            Action: bedrock:InvokeModel
            Resource:
              - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
              - arn:aws:bedrock:*::foundation-model/*

  HomeworkTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  McpServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Homework Helper MCP server (Streamable HTTP)
      CodeUri: build/lambda.zip    # made by deploy/deploy.py; `aws cloudformation package` ignores CodeUri in Globals
      Handler: run.sh
      Timeout: 60
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:30
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          MCP_API_KEY: !Ref McpApiKey
          GOOGLE_TOKEN_JSON: !Ref GoogleTokenJson
      Policies:
        - !Ref AppPolicy
      FunctionUrlConfig:
        AuthType: NONE        # the MCP_API_KEY bearer token guards it
        InvokeMode: BUFFERED

  ReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks Canvas and queues new homework reminders
      CodeUri: build/lambda.zip    # made by deploy/deploy.py; `aws cloudformation package` ignores CodeUri in Globals
      Handler: homework_helper.cloud.reminder_handler
      Timeout: 60
      Policies:
        - !Ref AppPolicy
      Events:
        Morning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 7 * * ? *)
            ScheduleExpressionTimezone: !Ref StudentTimezone
        Evening:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 19 * * ? *)
            ScheduleExpressionTimezone: !Ref StudentTimezone

Outputs:
  McpUrl:
    Description: Set MCP_URL to this, and MCP_API_KEY to your key
    Value: !Sub "${McpServerFunctionUrl.FunctionUrl}mcp"
  HomeworkTableName:
    Description: Set HOMEWORK_TABLE to this so the Alexa+ app reads cloud reminders
    Value: !Ref HomeworkTable
